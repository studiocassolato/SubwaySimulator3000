<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2a37" />
    <title>SubwaySimulator3000</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <canvas id="map"></canvas>

      <header class="topbar">
        <button id="btn-menu" class="icon" title="Menu">☰</button>
        <div class="brand">Subway<b>3000</b></div>
        <div class="stat" id="clock"></div>
        <div class="stat money" id="money"></div>
        <div class="stat level" id="level"></div>
        <div class="stat" id="reputation" title="Fiducia del sindaco: decide il contributo giornaliero del Comune"></div>
        <div class="stat hide-sm" id="satisfaction" title="Soddisfazione dei passeggeri"></div>
        <div class="speed">
          <button data-speed="0" title="Pausa (spazio)">⏸</button>
          <button data-speed="1" title="Normale (1)">▶</button>
          <button data-speed="3" title="Veloce (2)">⏩</button>
          <button data-speed="8" title="Velocissimo (3)">⏭</button>
        </div>
        <button id="btn-music" class="icon" title="Musica">🎵</button>
      </header>

      <div id="requests"></div>
      <div id="quote" hidden></div>
      <div id="toasts"></div>

      <aside class="panel" id="panel">
        <div class="sheet-handle" id="sheet-handle"></div>
        <nav class="tabs">
          <button data-tab="info" class="active">Info</button>
          <button data-tab="lines">Linee</button>
          <button data-tab="goals">Obiettivi</button>
          <button data-tab="log">Notizie</button>
        </nav>
        <div class="panel-body" id="panel-body"></div>
      </aside>

      <dialog id="menu">
        <div class="menu-inner" id="menu-body"></div>
      </dialog>
      <input type="file" id="import-file" accept="application/json,.json" hidden />
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
